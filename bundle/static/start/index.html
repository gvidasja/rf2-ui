<!doctype html>
<!--
  Served by the bundle at /start/index.html (the page rFactor 2 opens on startup), /event/index.html and
  /loading/index.html: the game switches between these native pages; the app picks its screens by path.
  If the Vite dev server is running (bun run dev) the UI is loaded from it with hot reload,
  otherwise the build packed into the jar is used. Add ?prod to force the packed build.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>rFactor2</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1113; }
      /* in a session the native 3D view sits behind this page: stay see-through (the app paints the rest) */
      html.rf2ui-event, html.rf2ui-event body { background: transparent; }
      #rf2ui-dev-badge { position: fixed; right: 4px; bottom: 4px; z-index: 99999; padding: 1px 6px;
        font: 11px sans-serif; color: #000; background: #fc0; border-radius: 3px; pointer-events: none; }
    </style>
    <script>
      // Chromium 75 polyfills needed by Vite's dev client.
      if (!Promise.allSettled) {
        Promise.allSettled = function (ps) {
          return Promise.all(Array.from(ps, function (p) {
            return Promise.resolve(p).then(
              function (value) { return { status: 'fulfilled', value: value } },
              function (reason) { return { status: 'rejected', reason: reason } })
          }))
        }
      }

      if (/^\/event\//.test(location.pathname)) document.documentElement.className = 'rf2ui-event';

      (function () {
        var stock = location.pathname.replace(/index\.html$/, 'stock.html')
        // The 1024×1024 browser that renders the name tags above cars (a texture in the 3D view) stays stock.
        if (/^\/event\//.test(location.pathname) && /^#\/driver-labels/.test(location.hash)) {
          location.replace(stock + location.hash)
          return
        }
        // "OLD UI" was chosen this game session (src/stockUi.ts): the game navigates here on its own
        // at times, so keep sending it to the stock page.
        try {
          if (sessionStorage.getItem('rf2ui.stockUi') === '1') {
            location.replace(stock + location.hash)
            return
          }
        } catch (e) {}

        var DEV = 'http://localhost:5173/rf2ui/'
        var PROD = '/rf2ui/'

        function addModule(code) {
          var s = document.createElement('script')
          s.type = 'module'
          s.textContent = code
          document.head.appendChild(s)
        }

        function loadDev() {
          addModule(
            "import RefreshRuntime from '" + DEV + "@react-refresh';" +
            'RefreshRuntime.injectIntoGlobalHook(window);' +
            'window.$RefreshReg$ = () => {};' +
            'window.$RefreshSig$ = () => (type) => type;' +
            'window.__vite_plugin_react_preamble_installed__ = true;' +
            // no top-level await in Chromium 75
            "import('" + DEV + "@vite/client').then(() => import('" + DEV + "src/main.tsx'));"
          )
          var badge = document.createElement('div')
          badge.id = 'rf2ui-dev-badge'
          badge.textContent = 'DEV'
          document.body.appendChild(badge)
        }

        function loadProd() {
          var css = document.createElement('link')
          css.rel = 'stylesheet'
          css.href = PROD + 'assets/index.css'
          document.head.appendChild(css)
          addModule("import '" + PROD + "assets/index.js';")
        }

        function probeDev() {
          if (/[?&]prod\b/.test(location.search)) return Promise.reject()
          var timeout = new Promise(function (_, reject) { setTimeout(reject, 500) })
          return Promise.race([fetch(DEV + '@vite/client', { cache: 'no-store' }), timeout]).then(function (r) {
            if (!r.ok) throw new Error()
          })
        }

        document.addEventListener('DOMContentLoaded', function () {
          probeDev().then(loadDev, loadProd)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
